name: Build and Release Lornshill Timetable APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Release APKs
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/LornshillTimetable.apk
          cp wear/build/outputs/apk/release/wear-release.apk wear/build/outputs/apk/release/LornshillWearOS.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LornshillTimetable-APKs
          path: |
            app/build/outputs/apk/release/LornshillTimetable.apk
            wear/build/outputs/apk/release/LornshillWearOS.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/LornshillTimetable.apk
            wear/build/outputs/apk/release/LornshillWearOS.apk
          generate_release_notes: true

